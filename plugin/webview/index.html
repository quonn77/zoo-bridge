<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
  <title>Bridge for Zoo Code</title>
  <!-- Zoo Code's own page (ClineProvider.getHtmlContent) with package-relative
       paths. zoo/ is generated by scripts/copy-webview-ui.mjs. The shim must
       run before the bundle: it defines acquireVsCodeApi(). -->
  <script src="./vscode-shim.js"></script>
  <link rel="stylesheet" type="text/css" href="./zoo/webview-ui/build/assets/index.css">
  <link rel="stylesheet" href="./zoo/assets/codicons/codicon.css">
  <link rel="stylesheet" href="./bridge-status.css">
  <script>
    // Zoo appends "/<file>" to these.
    window.IMAGES_BASE_URI = new URL("./zoo/assets/images", location.href).href;
    window.AUDIO_BASE_URI = new URL("./zoo/webview-ui/audio", location.href).href;
    window.MATERIAL_ICONS_BASE_URI = new URL("./zoo/assets/vscode-material-icons/icons", location.href).href;
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!-- The view title actions VS Code shows above Zoo Code (package.json
       menus › view/title), which OpenIDEA does not draw for a web view. -->
  <div id="zoo-bridge-toolbar" role="toolbar" aria-label="Zoo Bridge">
    <span class="zoo-bridge-toolbar-title">Zoo Bridge</span>
    <button type="button" data-command="zoo-code.plusButtonClicked" title="New Task"><i class="codicon codicon-edit"></i></button>
    <button type="button" data-command="zoo-code.settingsButtonClicked" title="Settings"><i class="codicon codicon-settings-gear"></i></button>
    <button type="button" data-command="zoo-code.marketplaceButtonClicked" title="Marketplace"><i class="codicon codicon-extensions"></i></button>
    <button type="button" data-command="zoo-code.historyButtonClicked" title="History"><i class="codicon codicon-history"></i></button>
    <span class="zoo-bridge-toolbar-sep"></span>
    <button type="button" data-bridge="stop" title="Stop the Zoo Code extension host"><i class="codicon codicon-debug-stop"></i></button>
  </div>
  <div id="zoo-bridge-notice" hidden>
    <span class="zoo-bridge-notice-text"><strong>Zoo Bridge</strong> — unofficial port of Zoo Code to OpenIDEA, not affiliated with Zoo Code Org.</span>
    <button type="button" class="zoo-bridge-notice-close" title="Hide" aria-label="Hide">×</button>
  </div>
  <div id="zoo-bridge-banner" hidden>
    <span class="zoo-bridge-dot"></span>
    <span class="zoo-bridge-text">Connecting to the Zoo Code extension host…</span>
    <button type="button" class="zoo-bridge-start" hidden>Start extension host</button>
  </div>
  <!-- What the sidecar is missing (the Zoo Code extension, ripgrep) and the
       user's consent to download it: bridge-status.js. -->
  <div id="zoo-bridge-deps" role="region" aria-label="Zoo Code setup" aria-live="polite" hidden>
    <div class="zbd-text">
      <strong class="zbd-title"></strong>
      <span class="zbd-body"></span>
    </div>
    <div class="zbd-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden><div class="zbd-bar"></div></div>
    <div class="zbd-actions">
      <button type="button" class="zbd-download"></button>
      <button type="button" class="zbd-later">Not now</button>
    </div>
  </div>
  <div id="root"></div>
  <script src="./bridge-status.js"></script>
  <script type="module" src="./zoo/webview-ui/build/assets/index.js"></script>
</body>
</html>
